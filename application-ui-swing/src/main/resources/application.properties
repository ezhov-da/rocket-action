# Spring Boot configuration for the embedded HTTP server.
#
# The server always starts together with the desktop application. The port is
# configured here (or overridden with -Drocket.action.handler.server.port=...).
rocket.action.handler.server.port=4567
server.port=${rocket.action.handler.server.port}

# The Spring Boot part of the application runs headless; the Swing UI is
# initialized before the Boot context is created (see App.kt).
spring.main.headless=true
spring.main.banner-mode=off
