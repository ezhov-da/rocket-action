org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The project targets Java 17. Gradle itself must run on JDK 17: Gradle
# 7.6.4 and Kotlin 1.8.10 do not support the JDK 25 installed by default.

kotlin.code.style=official

# Kotlin 1.8.10 is pinned to match the Maven build. The Kotlin Gradle plugin
# would otherwise add kotlin-stdlib to every module automatically, which would
# change the Maven "provided" dependency semantics (stdlib is packaged into
# plugin fat jars). Declare kotlin-stdlib explicitly in each module instead.
kotlin.stdlib.default.dependency=false
